<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" aria-label="Logo Passe Impact Hammamet">
  <defs>
    <linearGradient id="pi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="pi-terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="pi-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="pi-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle Badge -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#pi-bg)" stroke="rgba(255,255,255,0.2)" stroke-width="2" filter="url(#pi-glow)"/>

  <!-- Inner Decorative Border -->
  <rect x="7" y="7" width="86" height="86" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- The Architectural Medina Arch (Hammamet Arch) -->
  <path d="M 28 70 V 46 C 28 26, 72 26, 72 46 V 70" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Arch Keystones / Header Notch -->
  <path d="M 50 18 V 24" stroke="url(#pi-terracotta)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- The Central Impact Spark / Diamond -->
  <polygon points="50,30 55,44 69,49 55,54 50,68 45,54 31,49 45,44" 
           fill="url(#pi-terracotta)" 
           stroke="#ffffff" 
           stroke-width="1.2"/>

  <!-- Star Heart Pip -->
  <circle cx="50" cy="49" r="2.8" fill="#ffffff"/>

  <!-- Coastal Hammamet Waves / Digital Pass Foundation -->
  <path d="M 24 77 Q 37 73, 50 77 T 76 77" 
        fill="none" 
        stroke="url(#pi-gold)" 
        stroke-width="3.5" 
        stroke-linecap="round"/>
  <path d="M 30 83 Q 40 80, 50 83 T 70 83" 
        fill="none" 
        stroke="#93c5fd" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        opacity="0.9"/>
</svg>
